
name: Daily Fuel Data Collection

on:
  schedule:
    - cron: '0 6 * * *'  # Exécution chaque jour à 6h00 UTC
  workflow_dispatch:      # Permet le lancement manuel depuis GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas sqlalchemy psycopg2-binary

      - name: Execute script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collect_carburants.py


        