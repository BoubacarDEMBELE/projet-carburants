
name: Daily Fuel Data Collection

on:
  schedule:
    - cron: '0 6 * * *'  # Exécution chaque jour à 6h00 UTC
  workflow_dispatch:      # Permet le lancement manuel depuis GitHub

permissions:
  contents: write         # requis pour committer l'archive froide

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # >= 3.11 requis par pandas 3.x (voir requirements.txt)
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collect_carburants.py

      - name: Commit de l'archive froide
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          # Ne committe que s'il y a réellement un changement : sans ce garde-fou,
          # une relance le même jour ferait échouer le run sur "nothing to commit".
          git diff --staged --quiet || git commit -m "data: releve du $(date -u +%F)"
          git push


        