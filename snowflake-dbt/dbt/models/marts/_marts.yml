version: 2

models:
  - name: fct_fuel_prices
    description: Daily fuel price per station and fuel type. Grain = station x fuel x day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [station_id, fuel_code, date_day]
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships: {to: ref('dim_station'), field: station_id}
      - name: fuel_code
        tests:
          - not_null
          - relationships: {to: ref('dim_fuel_type'), field: fuel_code}
      - name: date_day
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_day}
      - name: price_eur_per_litre
        description: Pump price in EUR per litre, VAT included.

  - name: dim_station
    description: One row per fuel station.
    columns:
      - name: station_id
        tests: [unique, not_null]

  - name: dim_region
    description: French administrative regions.
    columns:
      - name: region_code
        tests: [unique, not_null]

  - name: dim_fuel_type
    description: Fuel reference data (seed).
    columns:
      - name: fuel_code
        tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension.
    columns:
      - name: date_day
        tests: [unique, not_null]
